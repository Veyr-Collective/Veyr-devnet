<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151616">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self' https://*.trycloudflare.com; frame-src 'none'">
    <meta name="description" content="The entry point for Isabella companion access.">
    <title>Isabella // Private companion access</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <style>
      :root { --rose: #e9afba; --rose-soft: #bd929b; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        background: radial-gradient(ellipse at 75% 35%, #36242a 0, transparent 57%), var(--bg);
      }
      .companion-shell {
        width: min(100% - 48px, 1024px);
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .companion-header, .companion-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 26px 0;
        color: var(--soft);
        font-size: .78rem;
      }
      .companion-header { border-bottom: 1px solid #d6d3cc40; }
      .companion-header a { padding: 8px 0; }
      .companion-header a:hover { color: var(--rose); }
      .companion-header a:focus-visible, button:focus-visible {
        outline: 2px solid var(--rose);
        outline-offset: 6px;
      }
      .companion-header span { color: var(--rose-soft); }
      main { display: grid; place-items: center; padding: 54px 0 64px; }
      .welcome { width: 100%; max-width: 650px; }
      .signature {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 30px;
        border: 1px solid #e9afba75;
        border-radius: 50%;
        color: var(--rose);
        font-family: Georgia, serif;
        font-size: 2.6rem;
        font-style: italic;
      }
      .companion-label {
        margin-bottom: 17px;
        color: var(--rose);
        font-size: .76rem;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 20px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(4.5rem, 14vw, 7.5rem);
        font-weight: 400;
        letter-spacing: -.065em;
        line-height: 1;
      }
      .welcome-copy {
        max-width: 42ch;
        margin: 0 0 35px;
        color: var(--ghost);
        font-size: 1.13rem;
        line-height: 1.7;
      }
      .access-panel {
        padding: 24px;
        border: 1px solid #e9afba55;
        background: #151616ad;
      }
      .access-heading { margin-bottom: 8px; font-size: 1rem; font-weight: 400; }
      .access-note { margin-bottom: 23px; font-size: .91rem; }
      .open-chat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        width: 100%;
        min-height: 52px;
        padding: 13px 17px;
        border: 1px solid var(--rose);
        background: var(--rose);
        color: var(--bg);
        font-size: 1rem;
        cursor: pointer;
      }
      .open-chat:hover:not(:disabled) { background: #f0c3cc; border-color: #f0c3cc; }
      .open-chat:disabled { border-color: #d6d3cc40; background: #252727; color: var(--soft); cursor: default; }
      .connection-status { min-height: 1.6em; margin: 15px 0 0; font-size: .81rem; line-height: 1.6; }
      .retry {
        margin-top: 15px;
        padding: 3px 0;
        border: 0;
        border-bottom: 1px solid #e9afba70;
        background: transparent;
        color: var(--rose);
        cursor: pointer;
      }
      .retry[hidden] { display: none; }
      .companion-footer { border-top: 1px solid #d6d3cc40; font-size: .69rem; }
      .companion-footer span:last-child { color: var(--rose-soft); }
      @media (max-width: 520px) {
        .companion-shell { width: calc(100% - 32px); }
        .companion-header { padding: 17px 0; font-size: .71rem; }
        .companion-header span { text-align: right; }
        main { padding: 40px 0; }
        .signature { width: 52px; height: 52px; margin-bottom: 25px; font-size: 2.1rem; }
        .welcome-copy { font-size: 1rem; margin-bottom: 26px; }
        .access-panel { padding: 19px; }
        .companion-footer { align-items: flex-start; padding: 19px 0; line-height: 1.5; }
        .companion-footer span:last-child { text-align: right; }
      }
    </style>
  </head>
  <body>
    <div class="companion-shell">
      <header class="companion-header">
        <a href="../index.html" aria-label="Back to Veyr Collective">← VEYR COLLECTIVE</a>
        <span>COMPANION ACCESS</span>
      </header>
      <main>
        <section class="welcome" aria-labelledby="welcome-title">
          <div class="signature" aria-hidden="true">i</div>
          <p class="companion-label">Private companion access</p>
          <h1 id="welcome-title">Isabella.</h1>
          <p class="welcome-copy">A little space to talk.<br>Come as you are. Stay a while.</p>
          <div class="access-panel">
            <h2 class="access-heading">Your conversation starts here.</h2>
            <p class="access-note">Continue with your GitHub sign-in.</p>
            <button class="open-chat" id="open-chat" type="button">
              <span id="open-chat-label">Continue with GitHub</span><span aria-hidden="true">↗</span>
            </button>
            <p class="connection-status" id="connection-status" role="status" aria-live="polite">Checking the private connection…</p>
            <button class="retry" id="retry" type="button" hidden>Check again</button>
            <noscript><p class="connection-status">Enable JavaScript to open the private chat link.</p></noscript>
          </div>
        </section>
      </main>
      <footer class="companion-footer">
        <span>VEYR COLLECTIVE / ISABELLA</span>
        <span>The chat opens with sign-in.</span>
      </footer>
    </div>
    <script>
      (() => {
        const openButton = document.getElementById('open-chat');
        const buttonLabel = document.getElementById('open-chat-label');
        const status = document.getElementById('connection-status');
        const retryButton = document.getElementById('retry');
        let destination = null;

        function savedGithubToken() {
          return sessionStorage.getItem('veyrGithubToken') || '';
        }

        function updateButton() {
          const signedIn = Boolean(savedGithubToken());
          buttonLabel.textContent = signedIn ? 'Open private chat' : 'Continue with GitHub';
          openButton.disabled = signedIn && !destination;
        }

        function submitGithubToken(url, token) {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = new URL('/auth/github', url).href;
          form.target = '_self';
          form.hidden = true;
          const tokenField = document.createElement('input');
          tokenField.type = 'hidden';
          tokenField.name = 'githubToken';
          tokenField.value = token;
          form.append(tokenField);
          document.body.append(form);
          form.submit();
        }

        function validateDestination(value) {
          if (typeof value !== 'string') return null;
          try {
            const url = new URL(value);
            if (url.protocol !== 'https:' ||
                !/^[a-z0-9]+(?:-[a-z0-9]+)*\.trycloudflare\.com$/i.test(url.hostname) ||
                url.username || url.password || url.port ||
                url.pathname !== '/' || url.search || url.hash) return null;
            return url.href;
          } catch {
            return null;
          }
        }

        async function checkConnection() {
          destination = null;
          updateButton();
          retryButton.hidden = true;
          status.textContent = 'Checking the private connection…';
          try {
            const response = await fetch('connection.json', {
              cache: 'no-store',
              credentials: 'omit',
              headers: { Accept: 'application/json' }
            });
            if (!response.ok) throw new Error('Connection unavailable');
            const config = await response.json();
            destination = config.status === 'ready' ? validateDestination(config.url) : null;
            if (!destination) throw new Error('Connection not configured');
            updateButton();
            status.textContent = savedGithubToken()
              ? 'Private link ready. Open your conversation.'
              : 'Private link ready. Continue with GitHub to open your conversation.';
          } catch {
            status.textContent = 'Her private connection isn’t ready yet. Check again in a moment.';
            retryButton.hidden = false;
          }
        }

        openButton.addEventListener('click', () => {
          const token = savedGithubToken();
          if (!token) {
            window.location.assign('../admin/?return=isabella&signin=2');
            return;
          }
          const verifiedDestination = validateDestination(destination);
          if (verifiedDestination) submitGithubToken(verifiedDestination, token);
        });
        retryButton.addEventListener('click', checkConnection);
        checkConnection();
      })();
    </script>
  </body>
</html>
